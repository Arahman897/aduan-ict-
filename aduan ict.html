<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Aduan ICT & Teknikal</title>
<style>
:root{--bg:#f5f3f8;--card:#fff;--tx:#1d1b22;--mu:#6b6776;--pr:#4b2a7b;--pr2:#e9e1f5;--bd:#ddd8e6;--ok:#1f7a4d;--wn:#b45309;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141c;--card:#221e2b;--tx:#efecf5;--mu:#a29cb0;--pr:#b89cf0;--pr2:#352a4d;--bd:#383247;--ok:#4cc38a;--wn:#f0a24b;--er:#f27a70}}
:root[data-theme="dark"]{--bg:#17141c;--card:#221e2b;--tx:#efecf5;--mu:#a29cb0;--pr:#b89cf0;--pr2:#352a4d;--bd:#383247;--ok:#4cc38a;--wn:#f0a24b;--er:#f27a70}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{background:var(--pr);color:#fff;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
:root:not([data-theme="light"]) header{color:#17141c}
header b{font-size:16px;display:block}header small{opacity:.85}.logo{background:#fff;border-radius:8px;padding:4px 8px;margin-bottom:8px;display:inline-block}.logo img{height:40px;max-width:100%;display:block}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 4px;font:inherit;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}nav span{display:block;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600;margin:8px 6px 0 0}
:root:not([data-theme="light"]) .btn{color:#17141c}
.btn.sec{background:var(--pr2);color:var(--pr)}.btn.bad{background:var(--er);color:#fff}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--pr2);color:var(--pr)}
.tag.ok{color:var(--ok)}.tag.wn{color:var(--wn)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:start}
.mu{color:var(--mu);font-size:13px}
.log{border-left:3px solid var(--pr2);padding-left:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{text-align:center}.stat b{font-size:26px;color:var(--pr);display:block}
.bar{height:8px;background:var(--pr);border-radius:4px}
.steps{display:flex;gap:4px;margin:8px 0}.steps i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.steps i.d{background:var(--pr)}
@media print{header,nav,.noprint{display:none!important}body{background:#fff}main{max-width:none;padding:0}#lap{border:0!important;padding:0!important}}
#lap{background:#fff;color:#111;border:1px solid var(--bd);border-radius:12px;padding:16px;margin:10px 0}
#lap h2{font-size:16px;text-align:center;margin:8px 0 2px}#lap p{margin:2px 0;text-align:center;font-size:13px}
#lap table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}#lap th,#lap td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}#lap th{background:#eee}
#lap .sg{display:flex;justify-content:space-between;margin-top:40px;font-size:13px}#lap .sg div{width:44%;border-top:1px solid #111;padding-top:4px}
.tw{overflow-x:auto}
</style>
</head>

et • Peralatan PdP</small><small id="st" style="display:block;margin-top:2px"></small></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KAT=["Laptop","Internet","LCD Projector / TV","Speaker / Audio","Lain-lain PdP"];
const ST={baru:"Aduan Diterima",periksa:"Pemeriksaan",susulan:"Tindakan Susulan",sahkan:"Menunggu Pengesahan",tutup:"Ditutup"};
const ORD=["baru","periksa","susulan","sahkan","tutup"];
/* ====== TETAPAN CLOUD ======
   Tampal URL Web App Google Apps Script di antara tanda petik.
   Jika dibiarkan kosong, data disimpan dalam peranti (mod setempat). */
const API_URL="https://script.google.com/macros/s/AKfycbw0SK03e-rNMznPCMkggiF92PO34E7H6imnBoxqaN2nidV1G2HIUYdaeF8FFQyn1r3tug/exec";
const CLOUD=!!API_URL;
let D=[],view="list",cur=null,q="",fs="";
if(!CLOUD){try{D=JSON.parse(localStorage.getItem("aduan")||"[]")}catch(e){D=[]}}
const lsSave=()=>{try{localStorage.setItem("aduan",JSON.stringify(D))}catch(e){}};
async function api(body){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.error||"Ralat");return j}
async function cloudLoad(){try{const r=await fetch(API_URL+"?action=list");const j=await r.json();if(j.ok){D=j.rows;setSt("☁️ Disegerak "+new Date().toLocaleTimeString("ms-MY",{timeStyle:"short"}))}}catch(e){setSt("⚠️ Tiada sambungan cloud")}}
function setSt(t){const e=document.getElementById("st");if(e)e.textContent=t}
const save=a=>{if(!CLOUD){lsSave();return}if(a)api({action:"upsert",rec:a}).then(()=>setSt("☁️ Disimpan")).catch(()=>{alert("Gagal simpan ke cloud. Semak sambungan internet.");cloudLoad().then(render)})};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=()=>new Date().toISOString();
const fmt=t=>new Date(t).toLocaleString("ms-MY",{dateStyle:"medium",timeStyle:"short"});
const $=id=>document.getElementById(id);
function go(v,id){view=v;cur=id||null;render();scrollTo(0,0)}
function nav(){$("nav").innerHTML=[["list","📋","Senarai"],["new","➕","Aduan Baru"],["stat","📊","Statistik"],["rep","📄","Laporan"]].map(([v,i,t])=>`<button class="${view==v||(v=='list'&&view=='det')?'on':''}" onclick="go('${v}')"><span>${i}</span>${t}</button>`).join("")}
function tagc(s){return s=="tutup"?"ok":s=="susulan"?"wn":""}
function render(){nav();$("app").innerHTML=view=="new"?vNew():view=="det"?vDet():view=="stat"?vStat():view=="rep"?vRep():vList()}
function vList(){
 let L=D.filter(a=>(!fs||a.s==fs)&&(!q||JSON.stringify(a).toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>b.t.localeCompare(a.t));
 return `<div class="card"><input id="sq" placeholder="Cari nama / lokasi / ID…" value="${esc(q)}" oninput="q=this.value;render();$('sq').focus()">
 <select onchange="fs=this.value;render()" style="margin-top:8px"><option value="">Semua status</option>${ORD.map(s=>`<option value="${s}" ${fs==s?'selected':''}>${ST[s]}</option>`).join("")}</select></div>`+
 (L.length?L.map(a=>`<div class="card" onclick="go('det','${a.id}')"><div class="row"><b>${a.id}</b><span class="tag ${tagc(a.s)}">${ST[a.s]}</span></div>
 <div>${esc(a.kat)} — ${esc(a.masalah).slice(0,80)}</div><div class="mu">${esc(a.nama)} (${a.jenis}) • ${esc(a.lokasi)} • ${fmt(a.t)}</div></div>`).join(""):`<p class="mu" style="text-align:center;margin-top:40px">Tiada aduan. Tekan “Aduan Baru”.</p>`)}
function vNew(){return `<div class="card"><b>1. Terima & Rekod Aduan</b>
 <label>Jenis pengadu</label><select id="jenis"><option>Pensyarah</option><option>Pelajar</option><option>Staf</option></select>
 <label>Nama</label><input id="nama">
 <label>Lokasi (bilik / dewan)</label><input id="lokasi">
 <label>Saluran aduan</label><select id="saluran"><option>Terus</option><option>Telefon</option><option>Lain-lain</option></select>
 <label>Kategori masalah</label><select id="kat">${KAT.map(k=>`<option>${k}</option>`).join("")}</select>
 <label>Peralatan (model / no. aset)</label><input id="alat">
 <label>Masalah</label><textarea id="masalah"></textarea>
 <button class="btn" onclick="addA()">Simpan Aduan</button></div>`}
async function addA(){
 const g=i=>$(i).value.trim();
 if(!g("nama")||!g("lokasi")||!g("masalah")){alert("Sila isi nama, lokasi dan masalah.");return}
 const rec={t:now(),jenis:g("jenis"),nama:g("nama"),lokasi:g("lokasi"),saluran:g("saluran"),kat:g("kat"),alat:g("alat"),masalah:g("masalah"),s:"baru",log:[{t:now(),x:"Aduan diterima & direkod ("+g("saluran")+")"}]};
 if(CLOUD){try{const j=await api({action:"create",rec});D.push(j.rec);go("det",j.rec.id)}catch(e){alert("Gagal simpan ke cloud: "+e.message)}return}
 const d=new Date(),p=`ADU-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,"0")}-`;
 rec.id=p+String(D.filter(a=>a.id.startsWith(p)).length+1).padStart(3,"0");
 D.push(rec);save();go("det",rec.id)}
const get=id=>D.find(a=>a.id==id);
function push(id,s,x){const a=get(id);if(s)a.s=s;a.log.push({t:now(),x});if(s=="tutup")a.tutup=now();save(a);render()}
function vDet(){
 const a=get(cur);if(!a)return"";
 const i=ORD.indexOf(a.s);
 let act="";
 if(a.s=="baru")act=`<button class="btn" onclick="push('${a.id}','periksa','Pegawai mula pemeriksaan di lokasi')">Mula Pemeriksaan di Lokasi</button>`;
 if(a.s=="periksa")act=`<label>Dapatan pemeriksaan / troubleshooting</label><textarea id="dap"></textarea>
  <b style="display:block;margin-top:12px">Boleh diselesaikan di lokasi?</b>
  <label>YA — tindakan (baiki / konfigurasi / tukar kabel atau aksesori)</label><textarea id="tin"></textarea>
  <button class="btn" onclick="ya('${a.id}')">YA — Selesai di lokasi</button>
  <label>TIDAK — rujuk kepada</label><select id="rj"><option>Alat ganti</option><option>Vendor</option><option>Unit ICT</option><option>Unit Teknikal</option></select>
  <button class="btn sec" onclick="tidak('${a.id}')">TIDAK — Tindakan susulan</button>`;
 if(a.s=="susulan")act=`<label>Catatan tindakan susulan</label><textarea id="cat"></textarea>
  <button class="btn" onclick="sel('${a.id}')">Masalah selesai / peralatan boleh digunakan</button>`;
 if(a.s=="sahkan")act=`<p class="mu">Pensyarah / pelajar mengesahkan tindakan.</p>
  <button class="btn" onclick="push('${a.id}','tutup','Pengadu mengesahkan masalah selesai. Aduan ditutup & rekod disimpan')">Pengadu Sahkan — Tutup Aduan</button>
  <button class="btn bad" onclick="push('${a.id}','periksa','Pengadu tidak berpuas hati — pemeriksaan semula')">Belum Selesai</button>`;
 return `<button class="btn sec" onclick="go('list')">← Senarai</button>
 <div class="card"><div class="row"><b>${a.id}</b><span class="tag ${tagc(a.s)}">${ST[a.s]}</span></div>
 <div class="steps">${ORD.map((s,k)=>`<i class="${k<=i?'d':''}"></i>`).join("")}</div>
 <div><b>${esc(a.kat)}</b> — ${esc(a.masalah)}</div>
 <p class="mu">${esc(a.nama)} (${a.jenis}) • ${esc(a.lokasi)}<br>Saluran: ${esc(a.saluran)} • Peralatan: ${esc(a.alat||"-")}<br>${fmt(a.t)}</p></div>
 ${act?`<div class="card">${act}</div>`:""}
 <div class="card"><b>Rekod Tindakan</b>${a.log.map(l=>`<div class="log">${esc(l.x)}<div class="mu">${fmt(l.t)}</div></div>`).join("")}
 ${a.s=="tutup"?"":""}<button class="btn bad" onclick="del('${a.id}')" style="margin-top:14px">Padam</button></div>`}
function ya(id){const d=$("dap").value.trim(),t=$("tin").value.trim();if(!t){alert("Isi tindakan yang dibuat.");return}
 push(id,"sahkan",`Pemeriksaan: ${d||"-"}. Diselesaikan di lokasi: ${t}. Diuji semula & berfungsi`)}
function tidak(id){const d=$("dap").value.trim();push(id,"susulan",`Pemeriksaan: ${d||"-"}. Tidak dapat diselesaikan di lokasi — dirujuk kepada ${$("rj").value}`)}
function sel(id){const c=$("cat").value.trim();push(id,"sahkan","Tindakan susulan selesai: "+(c||"-")+". Peralatan boleh digunakan")}
function del(id){if(confirm("Padam aduan "+id+"?")){D=D.filter(a=>a.id!=id);if(CLOUD)api({action:"delete",id}).catch(()=>alert("Gagal padam di cloud."));else save();go("list")}}
function vStat(){
 const m=new Date().toISOString().slice(0,7),M=D.filter(a=>a.t.startsWith(m));
 const c=(L,f)=>L.filter(f).length,mx=Math.max(1,...KAT.map(k=>c(M,a=>a.kat==k)));
 return `<div class="card"><b>Statistik Bulan Ini (${m})</b><div class="grid" style="margin-top:10px">
 <div class="stat"><b>${M.length}</b>Jumlah</div><div class="stat"><b>${c(M,a=>a.s=="tutup")}</b>Ditutup</div>
 <div class="stat"><b>${c(D,a=>a.s!="tutup")}</b>Belum tutup</div><div class="stat"><b>${c(M,a=>a.s=="susulan")}</b>Susulan</div></div></div>
 <div class="card"><b>Mengikut Kategori</b>${KAT.map(k=>{const n=c(M,a=>a.kat==k);return `<div style="margin-top:10px"><div class="row"><span>${k}</span><span>${n}</span></div><div class="bar" style="width:${n/mx*100}%"></div></div>`}).join("")}</div>
 <div class="card"><b>Eksport rekod (audit)</b><p class="mu">Salin semua rekod sebagai CSV untuk ditampal ke Excel.</p><button class="btn" onclick="csv()">Salin CSV</button></div>`}
function csv(){
 const r=[["ID","Tarikh","Jenis","Nama","Lokasi","Kategori","Masalah","Status","Ditutup"]].concat(D.map(a=>[a.id,a.t,a.jenis,a.nama,a.lokasi,a.kat,a.masalah,ST[a.s],a.tutup||""]));
 const t=r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
 try{navigator.clipboard.writeText(t).then(()=>alert("CSV disalin."),()=>prompt("Salin:",t))}catch(e){prompt("Salin:",t)}}
let R={m:new Date().toISOString().slice(0,7),k:"",s:""};
const hari=ms=>{const h=ms/36e5;return h<24?h.toFixed(1)+" jam":(h/24).toFixed(1)+" hari"};
function repL(){return D.filter(a=>(!R.m||a.t.startsWith(R.m))&&(!R.k||a.kat==R.k)&&(!R.s||a.s==R.s)).sort((a,b)=>a.t.localeCompare(b.t))}
function vRep(){
 const L=repL(),T=L.filter(a=>a.tutup),avg=T.length?hari(T.reduce((x,a)=>x+(new Date(a.tutup)-new Date(a.t)),0)/T.length):"-";
 const logo=document.querySelector(".logo img").src;
 return `<div class="card noprint"><b>Jana Laporan</b>
 <label>Bulan (kosongkan untuk semua tempoh)</label><input type="month" value="${R.m}" onchange="R.m=this.value;render()">
 <label>Kategori</label><select onchange="R.k=this.value;render()"><option value="">Semua</option>${KAT.map(k=>`<option ${R.k==k?'selected':''}>${k}</option>`).join("")}</select>
 <label>Status</label><select onchange="R.s=this.value;render()"><option value="">Semua</option>${ORD.map(x=>`<option value="${x}" ${R.s==x?'selected':''}>${ST[x]}</option>`).join("")}</select>
 <button class="btn" onclick="print()">🖨️ Cetak / Simpan PDF</button>
 <button class="btn sec" onclick="dlCsv()">⬇️ Muat turun CSV</button></div>
 <div id="lap"><div style="text-align:center"><img src="${logo}" style="height:44px"></div>
 <h2>LAPORAN ADUAN SOKONGAN ICT DAN TEKNIKAL</h2>
 <p>Tempoh: ${R.m||"Semua tempoh"}${R.k?" • "+R.k:""}${R.s?" • "+ST[R.s]:""}</p><p>Dijana: ${fmt(now())}</p>
 <table><tr><th>Jumlah aduan</th><th>Ditutup</th><th>Belum tutup</th><th>Tindakan susulan</th><th>Purata masa selesai</th></tr>
 <tr><td>${L.length}</td><td>${T.length}</td><td>${L.length-T.length}</td><td>${L.filter(a=>a.log.some(l=>l.x.includes("dirujuk")))?.length}</td><td>${avg}</td></tr></table>
 <table><tr><th>Kategori</th><th>Bil.</th></tr>${KAT.map(k=>`<tr><td>${k}</td><td>${L.filter(a=>a.kat==k).length}</td></tr>`).join("")}</table>
 <div class="tw"><table><tr><th>#</th><th>ID</th><th>Tarikh</th><th>Pengadu</th><th>Lokasi</th><th>Kategori</th><th>Masalah</th><th>Status</th><th>Ditutup</th></tr>
 ${L.map((a,i)=>`<tr><td>${i+1}</td><td>${a.id}</td><td>${fmt(a.t)}</td><td>${esc(a.nama)} (${a.jenis})</td><td>${esc(a.lokasi)}</td><td>${esc(a.kat)}</td><td>${esc(a.masalah)}</td><td>${ST[a.s]}</td><td>${a.tutup?fmt(a.tutup):"-"}</td></tr>`).join("")||'<tr><td colspan="9">Tiada rekod.</td></tr>'}</table></div>
 <div class="sg"><div>Disediakan oleh</div><div>Disemak oleh</div></div></div>
 <div class="card noprint"><b>Sandaran data</b><p class="mu">Simpan salinan rekod pada peranti, dan pulihkan jika tukar peranti atau data terpadam.</p>
 <button class="btn sec" onclick="dlJson()">💾 Sandar (JSON)</button>
 <label>Pulih daripada fail sandaran</label><input type="file" accept=".json,application/json" onchange="pulih(this.files[0])"></div>`}
function dl(name,text,type){
 try{const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
 catch(e){try{navigator.clipboard.writeText(text);alert("Muat turun tidak disokong di sini. Kandungan disalin ke papan klip.")}catch(x){prompt("Salin:",text)}}}
function dlCsv(){
 const r=[["ID","Tarikh","Jenis","Nama","Lokasi","Saluran","Kategori","Peralatan","Masalah","Status","Ditutup"]].concat(repL().map(a=>[a.id,a.t,a.jenis,a.nama,a.lokasi,a.saluran,a.kat,a.alat||"",a.masalah,ST[a.s],a.tutup||""]));
 dl("laporan-aduan-"+(R.m||"semua")+".csv","\ufeff"+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),"text/csv;charset=utf-8")}
function dlJson(){dl("sandaran-aduan-"+now().slice(0,10)+".json",JSON.stringify(D),"application/json")}
function pulih(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const A=JSON.parse(r.result);if(!Array.isArray(A))throw 0;let n=0;A.forEach(a=>{if(a&&a.id&&!get(a.id)){D.push(a);n++}});if(CLOUD)api({action:"upsertMany",recs:A}).catch(()=>alert("Gagal pulih ke cloud."));else save();alert(n+" rekod dipulihkan.");render()}catch(e){alert("Fail sandaran tidak sah.")}};r.readAsText(f)}
render();
if(CLOUD){setSt("☁️ Memuatkan…");cloudLoad().then(render);
 setInterval(()=>{const t=document.activeElement&&document.activeElement.tagName;if(view=="new"||view=="det"||/INPUT|SELECT|TEXTAREA/.test(t||""))return;cloudLoad().then(render)},30000)}
</script>
</body>
